<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What happened to Tom?</title>
<meta name="theme-color" content="#FFFAC6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tom">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════ Lern-App-Baukasten · Engine (Design nach EUV4 „New York“) ════════
   Fachfarben aus den PPT-Vorlagen: Deutsch #FF8B80 · Englisch #FFFAC6 · Musik #F2CFEE · WiB weiß/#E8E8E8 */
:root{
  --canvas:#DEDBD6; --surface:#F3F2EF; --card:#FFFFFF; --ink:#1B1B1E; --ink2:#46464C; --muted:#86868D; --line:#E2DFDA; --soft:#F5F3EF;
  --accent:#FFC93C; --accent-ink:#2B2100; --star:#FFC93C; --tint:#FFF6D6; --tint-ink:#5A4100;
  --ok:#22B26B; --oksoft:#E3F6EC; --bad:#E5484D; --badsoft:#FDECEC; --sel:#2F6FEB; --selsoft:#E6EEFD;
  --sh:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(30,25,20,.08);
  --sh2:0 2px 6px rgba(0,0,0,.06),0 22px 50px rgba(30,25,20,.18);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
body.f-englisch{--canvas:#EDE5A2;--surface:#FFFAC6;--line:#EAE2B0;--soft:#FFFCE3;--accent:#FFC93C;--accent-ink:#2B2100;--tint:#FFF3C4;--tint-ink:#5A4100}
body.f-deutsch{--canvas:#E9695E;--surface:#FF8B80;--line:#F1D3CF;--soft:#FFF1EF;--accent:#FF8B80;--accent-ink:#3A0D08;--tint:#FFE4E0;--tint-ink:#6E1C14}
body.f-musik{--canvas:#E2B3DC;--surface:#F2CFEE;--line:#EBD5E8;--soft:#FBF0F9;--accent:#F2CFEE;--accent-ink:#45173F;--tint:#FBE6F7;--tint-ink:#5C1F55}
body.f-wib{--canvas:#D2D2D2;--surface:#E8E8E8;--line:#E2E2E2;--soft:#F4F4F4;--accent:#FFFFFF;--accent-ink:#1B1B1E;--tint:#EFF3F6;--tint-ink:#2A3A48}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
.ic{width:20px;height:20px;flex:none}
.st{width:15px;height:15px;fill:currentColor;flex:none}
.stars{display:inline-flex;gap:1px;align-items:center}
.shell{max-width:1240px;margin:14px auto;background:var(--surface);border-radius:34px;padding:14px 22px 26px;min-height:calc(100vh - 28px);min-height:calc(100dvh - 28px);box-shadow:var(--sh)}

/* Kopfzeile */
.top{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 4px;margin-bottom:10px}
.top.hide{display:none}
.team{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap;max-width:260px;overflow:hidden}
.logo{width:40px;height:40px;border-radius:12px;flex:none;background:var(--ink);color:var(--star);display:grid;place-items:center}
.logo .ic{width:22px;height:22px}
.team span{overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;margin:0 auto;background:rgba(255,255,255,.6);padding:4px;border-radius:999px;overflow:hidden;min-width:0}
.step{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 9px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.step .mk{min-width:26px;height:26px;border-radius:999px;display:grid;place-items:center;padding:0 6px;background:#E7E4DF;color:var(--ink2)}
.step .mk .st{width:12px;height:12px}
.step .mk .ic{width:14px;height:14px}
.step.cur{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.step.cur .mk{background:var(--ink);color:var(--star)}
.step.done .mk{background:var(--ok);color:#fff}
.timer,.wbtn{height:42px;border-radius:999px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:700;background:var(--card);box-shadow:var(--sh);font-size:16px;white-space:nowrap;flex:none}
.timer{font-variant-numeric:tabular-nums}
.wbtn{font-size:15px}
.wbtn .ic{width:18px;height:18px}
.timer.warn{background:var(--star);color:#2B2100}
.timer.crit{background:var(--bad);color:#fff}

/* Knöpfe */
.btn{min-height:50px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:600;white-space:nowrap;transition:transform .15s,background .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn.big{min-height:60px;padding:0 30px;font-size:18px}
.btn.dark{background:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.tip{background:var(--tint);color:var(--tint-ink)}
.btn.okb{background:var(--ok);color:#fff}
.btn.appear{animation:popIn .5s cubic-bezier(.2,.9,.3,1.25) both}
.btn[disabled]{opacity:.35;pointer-events:none}
.linkbtn{font-size:15px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:12px}

/* Start */
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:360px;background:var(--soft) center 30%/cover no-repeat;display:flex;align-items:center;justify-content:flex-end;padding:48px 56px}
.hero .art{position:absolute;left:0;top:0;bottom:0;width:58%;background:var(--artbg,#eee)}
.hero .art svg{width:100%;height:100%;display:block}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.9) 40%,rgba(255,255,255,0) 58%);z-index:1}
.hero-in{position:relative;z-index:2;max-width:560px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:16px}
.eyebrow b{width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px rgba(0,0,0,.08)}
.hero h1{font-size:48px;line-height:1.06;letter-spacing:-.03em;margin:0 0 14px;font-weight:800}
.hero p{font-size:18px;line-height:1.5;color:var(--ink2);margin:0}
.startrow{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.lvlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.lvmini{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/1.05;background:var(--c,#eee);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.lvmini>.ico{width:44%;height:44%;color:var(--ink);opacity:.85;margin-bottom:34%}
.lvmini>.ico svg{width:100%;height:100%}
.lvmini>span{display:block;position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:16px;font-size:13px;font-weight:600;padding:6px 8px;text-align:center;line-height:1.25}
.lvmini>span>.stars{display:flex;justify-content:center;color:#E0A800;margin-bottom:2px}
.lvmini.bonus::after{content:var(--bonus,"Bonus");position:absolute;top:8px;right:8px;background:var(--ink);color:var(--star);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.rules{margin-top:12px;font-size:15px;color:var(--ink2);font-weight:600;text-align:center}
.go-card{background:var(--card);border-radius:26px;padding:22px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.go-card h3{margin:0 0 2px;font-size:20px;line-height:1.3}
.namerow label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 4px 16px}
.tin{width:100%;height:52px;border-radius:999px;border:1.5px solid var(--line);padding:0 20px;font-size:18px;outline:none;background:var(--soft)}
.tin:focus{border-color:var(--ink);background:#fff}
.goal{display:flex;gap:12px;align-items:center;background:var(--tint);color:var(--tint-ink);border-radius:18px;padding:12px 16px;font-size:16px;font-weight:500;line-height:1.4}
.goal b{font-weight:700}

/* Erklärseite */
.brief{display:grid;grid-template-columns:.85fr 1.15fr;background:var(--card);border-radius:30px;box-shadow:var(--sh);overflow:hidden;max-width:1000px;margin:10px auto 0;animation:rise .5s both}
.brief .pic{min-height:400px;background:var(--c,#eee);position:relative;display:grid;place-items:center}
.brief .pic .ico{width:46%;color:var(--ink);opacity:.85}
.brief .pic .ico svg{width:100%;height:auto}
.brief .pic .lbadge{position:absolute;left:20px;top:20px}
.brief .txt{padding:40px 40px 34px;display:flex;flex-direction:column;gap:18px}
.brief .kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brief h2{margin:-8px 0 0;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.brief ol{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.brief li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:18px;line-height:1.45}
.brief li b.n{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--star);display:grid;place-items:center;font-size:16px}
.brief .go{margin-top:auto;align-self:flex-start}

/* Level-Kopf */
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.lt{display:flex;align-items:center;gap:12px;flex:1;min-width:260px}
.lbadge{height:46px;padding:0 12px;border-radius:16px;background:var(--ink);color:var(--star);display:inline-flex;align-items:center;flex:none}
.lbadge .st{width:18px;height:18px}
.lt b{display:block;font-size:21px;letter-spacing:-.01em}
.lt small{display:block;color:var(--ink2);font-size:15px;margin-top:2px}
.lacts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Station: Material links, Aufgabe rechts */
.sgrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.sgrid.mat{grid-template-columns:1fr 1.08fr}
.matcard{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:22px 26px;max-height:calc(100dvh - 190px);overflow:auto;-webkit-overflow-scrolling:touch;position:sticky;top:14px}
.task{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:22px 28px 20px;animation:rise .4s both}
.thead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.thead h3{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.2;flex:1}
.tnum{font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:5px 11px;white-space:nowrap}
.tq{font-size:19px;line-height:1.5;margin:8px 0 14px;font-weight:500}
.tq p{margin:0 0 8px}
.tfoot{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.tfoot .sp{flex:1}
.fb{display:flex;gap:10px;align-items:center;border-radius:16px;padding:12px 16px;font-size:16px;font-weight:600;margin-top:14px;line-height:1.4}
.fb.ok{background:var(--oksoft);color:#11683D}
.fb.bad{background:var(--badsoft);color:#9B1C20}
.fb.tipbox{background:var(--tint);color:var(--tint-ink);font-weight:500}
.fb .ic{flex:none}
.pips{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.pips button{height:10px;flex:1;min-width:22px;max-width:70px;border-radius:9px;background:rgba(0,0,0,.12)}
.pips button.d{background:var(--ok)}
.pips button.c{background:var(--ink)}

/* Inhaltsbausteine */
.md{font-size:18px;line-height:1.6}
.md p{margin:0 0 12px}
.md ul{margin:0 0 12px;padding-left:22px}
.md li{margin:4px 0}
.md h4{margin:4px 0 8px;font-size:20px}
.merke{background:var(--tint);color:var(--tint-ink);border-radius:20px;padding:16px 20px;display:flex;gap:12px}
.merke .ic{width:24px;height:24px;flex:none;margin-top:3px}
.figure{display:block;max-width:100%;max-height:46vh;margin:6px auto 12px;border-radius:16px;box-shadow:var(--sh)}
.rtext{font-size:18px;line-height:1.75}
.rtext .ln{display:grid;grid-template-columns:34px 1fr;gap:10px}
.rtext .ln i{font-style:normal;color:var(--muted);font-size:13px;text-align:right;padding-top:5px;font-variant-numeric:tabular-nums}
.rtext p{margin:0 0 12px}
.rhead{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.rtitle{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
.gl{border-bottom:2.5px dotted #B8B4AE;cursor:pointer}
audio{width:100%;margin:6px 0 10px}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin:6px 0 10px}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Auswahl (MC) */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--soft);border-radius:18px;padding:14px 16px;font-size:18px;font-weight:500;line-height:1.4;border:2.5px solid transparent;min-height:58px;transition:border-color .2s,background .2s}
.opt b{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.opt.on{border-color:var(--sel);background:var(--selsoft)}
.opt.on b{background:var(--sel);color:#fff;box-shadow:none}
.opt.ok{border-color:var(--ok);background:var(--oksoft)}
.opt.ok b{background:var(--ok);color:#fff;box-shadow:none}
.opt.bad{border-color:var(--bad);background:var(--badsoft)}
.opt.bad b{background:var(--bad);color:#fff;box-shadow:none}
.opt img{max-height:90px;border-radius:10px}

/* Richtig/Falsch */
.tf{display:grid;gap:10px}
.tfr{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--soft);border-radius:18px;padding:12px 12px 12px 18px;font-size:18px;line-height:1.4;border:2.5px solid transparent}
.tfr.ok{border-color:var(--ok);background:var(--oksoft)}
.tfr.bad{border-color:var(--bad);background:var(--badsoft)}
.seg{display:flex;gap:4px;background:#fff;padding:4px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{min-height:42px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}

/* Lücken */
.gtext{font-size:20px;line-height:2.25}
.gin{display:inline-block;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--soft);padding:0 10px;font-size:19px;outline:none;vertical-align:middle;min-width:70px;text-align:center;transition:border-color .2s,background .2s}
.gin:focus{border-color:var(--ink);background:#fff}
.gslot{display:inline-flex;align-items:center;justify-content:center;height:42px;min-width:96px;padding:0 12px;border-radius:12px;background:#F1EBDD;box-shadow:inset 0 -2px 0 #BFB49D;font-size:19px;font-weight:600;vertical-align:middle;margin:0 2px;line-height:1}
.gslot.f{background:var(--selsoft);box-shadow:inset 0 0 0 2px var(--sel)}
.gslot.act{box-shadow:inset 0 0 0 2.5px var(--ink);background:#fff}
.gin.ok,.gslot.ok{border-color:var(--ok);background:var(--oksoft);box-shadow:inset 0 0 0 2px var(--ok)}
.gin.bad,.gslot.bad{border-color:var(--bad);background:var(--badsoft);box-shadow:inset 0 0 0 2px var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:14px;border-radius:20px;background:var(--soft)}
.chip{min-height:46px;padding:0 16px;border-radius:14px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06),inset 0 0 0 1.5px var(--line);font-size:18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,opacity .2s,box-shadow .2s}
.chip:active{transform:scale(.95)}
.chip.used{opacity:.25;pointer-events:none}
.chip.on{box-shadow:inset 0 0 0 2.5px var(--sel);background:var(--selsoft)}
.chip.ok{box-shadow:inset 0 0 0 2px var(--ok);background:var(--oksoft)}
.chip.bad{box-shadow:inset 0 0 0 2px var(--bad);background:var(--badsoft)}
.chip img{height:60px;border-radius:8px;margin:6px 0}

/* Zuordnen */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.pcol{display:grid;gap:10px;align-content:start}
.pcol h5{margin:0 0 2px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pit{display:flex;align-items:center;gap:10px;text-align:left;background:var(--soft);border-radius:16px;padding:12px 14px;font-size:17px;font-weight:500;line-height:1.35;border:2.5px solid transparent;min-height:56px}
.pit i{width:26px;height:26px;border-radius:50%;flex:none;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-style:normal;font-size:13px;font-weight:700;display:grid;place-items:center;color:#fff}
.pit.on{border-color:var(--ink);background:#fff}
.pit.ok{border-color:var(--ok)}
.pit.bad{border-color:var(--bad);background:var(--badsoft)}
.pit img{max-height:70px;border-radius:8px}

/* Kategorien */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.cat{background:var(--soft);border-radius:20px;padding:12px;min-height:130px;display:flex;flex-direction:column;gap:8px;border:2.5px dashed transparent;text-align:left;transition:border-color .2s}
.cat.armed{border-color:var(--ink)}
.cat h5{margin:2px 4px 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.cat h5 i{width:12px;height:12px;border-radius:50%;background:var(--ink)}
.cat .chip{font-size:16px;min-height:42px}

/* Reihenfolge */
.order{min-height:66px;border-radius:20px;background:var(--soft);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;border:2.5px dashed var(--line)}
.order.list{flex-direction:column;align-items:stretch}
.order.list .chip{justify-content:flex-start;text-align:left;white-space:normal;padding:10px 14px;line-height:1.35}
.order .chip b{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.order.ok{border-color:var(--ok);background:var(--oksoft)}
.order.bad{border-color:var(--bad);background:var(--badsoft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pool.list{flex-direction:column;align-items:stretch}
.pool.list .chip{justify-content:flex-start;white-space:normal;padding:10px 14px;line-height:1.35;text-align:left}
.olabel{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 6px}

/* Markieren */
.mtext{font-size:20px;line-height:2}
.tok{border-radius:8px;padding:2px 3px;margin:0 -1px;cursor:pointer;transition:background .15s}
.tok.on{background:var(--star);box-shadow:0 0 0 2px var(--star)}
.tok.ok{background:#BDEBD2;box-shadow:0 0 0 2px var(--ok)}
.tok.bad{background:#F9C9CB;box-shadow:0 0 0 2px var(--bad)}
.tok.miss{box-shadow:0 0 0 2px var(--ok);background:transparent}

/* Schreiben */
.wr textarea,.sa input{width:100%;resize:none;border:2px solid transparent;background:var(--soft);border-radius:18px;padding:14px 16px;font-size:19px;line-height:1.5;outline:none;min-height:150px;transition:border-color .2s,background .2s}
.sa input{min-height:56px;height:56px;border-radius:999px;padding:0 20px}
.wr textarea:focus,.sa input:focus{border-color:var(--ink);background:#fff}
.sa input.ok{border-color:var(--ok);background:var(--oksoft)}
.sa input.bad{border-color:var(--bad);background:var(--badsoft)}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.starters .chip{font-size:15px;min-height:40px;background:var(--tint);color:var(--tint-ink);box-shadow:none}
.wcount{font-size:14px;font-weight:600;color:var(--muted);margin-top:8px;text-align:right}
.wcount.ok{color:var(--ok)}
.check{display:grid;gap:8px;margin-top:14px}
.check button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--soft);border-radius:16px;padding:10px 14px;font-size:16px;font-weight:500;min-height:50px}
.check button i{width:26px;height:26px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;flex:none}
.check button i svg{opacity:0}.check button.on i svg{opacity:1}
.check button.on i{background:var(--ok);box-shadow:none;color:#fff}

/* Dialog */
.dbox{background:#fff;border-radius:22px;padding:4px 4px}
.dl{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:10px 6px;border-bottom:1px solid #EEECE8;align-items:baseline}
.dl:last-child{border-bottom:0}
.who{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;color:var(--c)}
.who em{font-style:normal;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.dl .tx{font-size:20px;line-height:1.45;font-weight:500}
.dot{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none;background:var(--c)}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;box-shadow:0 0 0 2px var(--c);flex:none}
.blk{display:inline-block;min-width:calc(var(--len)*.5em + 16px);height:1.25em;vertical-align:-.28em;border-radius:7px;background:#F1EBDD;box-shadow:inset 0 -2px 0 #BFB49D;margin:0 2px}
.bstage{background:var(--soft);border-radius:22px;padding:18px;min-height:260px;display:flex;flex-direction:column;gap:12px}
.bubble{position:relative;background:#fff;border-radius:24px;padding:16px 22px 18px;max-width:86%;box-shadow:var(--sh);font-size:22px;line-height:1.5;font-weight:500;animation:popIn .45s cubic-bezier(.2,.9,.3,1.25) both}
.bubble.l{margin-right:auto;border-bottom-left-radius:6px;box-shadow:inset 4px 0 0 var(--c),var(--sh)}
.bubble.r{margin-left:auto;border-bottom-right-radius:6px;box-shadow:inset -4px 0 0 var(--c),var(--sh)}
.bwho{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:6px;color:var(--c)}
.bwho em{font-style:normal;font-weight:500;color:var(--muted)}
.bprog{display:flex;gap:5px}
.bprog i{flex:1;height:6px;border-radius:9px;background:rgba(0,0,0,.1)}
.bprog i.d{background:var(--ink)}

/* Karteikarten */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fc{perspective:900px;height:150px}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .fa,.fc .ba{position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:20px;font-weight:600;line-height:1.35;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc .fa{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line)}
.fc .ba{background:var(--ink);color:#fff;transform:rotateY(180deg);font-weight:500}
.fc .fa img{max-height:110px;max-width:100%;border-radius:10px}
.fc.seen .fa::after{content:"";position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--ok)}

/* Bericht / Präsentation */
.badge-ic{width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--star);display:grid;place-items:center;margin:0 auto}
.badge-ic .ic{width:36px;height:36px}
.ask{background:var(--card);border-radius:30px;box-shadow:var(--sh);padding:36px 30px;text-align:center;max-width:760px;margin:20px auto}
.ask h2{margin:16px 0 8px;font-size:32px;letter-spacing:-.02em}
.ask p{margin:0 auto 20px;color:var(--ink2);font-size:17px;max-width:560px}
.ask .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.score{display:inline-flex;gap:10px;align-items:center;background:var(--soft);border-radius:999px;padding:10px 20px;font-size:18px;font-weight:700;margin-bottom:4px}
.rep{max-width:900px;margin:0 auto;display:grid;gap:12px}
.rcard{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:18px 22px}
.rcard h4{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:10px}
.rrow{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;border-top:1px solid #EEECE8;font-size:16px;line-height:1.45;align-items:start}
.rrow:first-of-type{border-top:0}
.rrow .m{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}
.rrow .m .ic{width:15px;height:15px}
.rrow .m.a{background:var(--ok)} .rrow .m.b{background:#9AD3B2} .rrow .m.c{background:var(--star);color:#2B2100} .rrow .m.d{background:#CFCBC4}
.rrow blockquote{margin:6px 0 0;padding:10px 14px;background:var(--soft);border-radius:14px;font-size:17px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}

.ovl{position:fixed;inset:0;background:rgba(24,22,20,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.ovl.open{display:flex}
.sheet{background:#fff;border-radius:30px;max-width:540px;width:100%;padding:30px 30px 26px;box-shadow:var(--sh2);max-height:92vh;overflow:auto;animation:popIn .4s cubic-bezier(.2,.9,.3,1.2) both;text-align:center}
.sheet h2{margin:16px 0 8px;font-size:26px;letter-spacing:-.02em}
.sheet p{margin:0 auto 6px;color:var(--ink2);line-height:1.5;max-width:420px}
.sheet.bankw{max-width:720px;text-align:left;padding:22px 24px}
.sh-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.shead h2{margin:0;font-size:24px}
.wgrid{display:grid;gap:12px}
.wcard{background:var(--soft);border-radius:20px;padding:16px 20px;border:2.5px solid transparent}
.wcard.sel{background:var(--tint);border-color:var(--star)}
.wcard .w-en{font-size:24px;font-weight:700}
.wcard .w-de{font-size:18px;color:var(--ink2);margin-top:2px}
.wcard .w-ex{font-size:16px;color:var(--ink2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);line-height:1.45}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:90;box-shadow:var(--sh2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:95;display:none}
.dev{position:fixed;left:10px;bottom:10px;z-index:99;background:#7C3AED;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.dev select{font-size:12px;border-radius:8px;border:0;padding:2px 4px;max-width:260px}
.lock{max-width:460px;margin:80px auto;background:#fff;border-radius:30px;box-shadow:var(--sh);padding:34px;text-align:center}
.lock h2{margin:16px 0 8px}
.lock .tin{text-align:center;margin:16px 0 12px}
.lock small{display:block;min-height:22px;color:var(--bad);font-weight:600}

@keyframes popIn{from{opacity:0;transform:scale(.86) translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.shake{animation:shake .45s both}

@media (max-width:1020px){
  .startrow,.sgrid.mat{grid-template-columns:1fr}
  .matcard{position:static;max-height:42vh}
  .hero h1{font-size:40px}
  .step>span:last-child{display:none}
  .step{padding:7px}
  .brief{grid-template-columns:1fr}
  .brief .pic{min-height:200px}
  .brief .pic .ico{width:120px}
}
@media (max-width:820px){
  .hero{padding:34px 28px;min-height:300px}
  .hero .art{width:100%;opacity:.35}
  .hero::before{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.75))}
}
@media (max-width:620px){
  .shell{margin:0;border-radius:0;padding:10px 14px 20px;min-height:100vh}
  .top{flex-wrap:wrap}
  .steps{order:3;margin:0}
  .wbtn span{display:none}
  .hero h1{font-size:30px}
  .pairs{grid-template-columns:1fr 1fr;gap:8px}
  .dl{grid-template-columns:1fr;gap:4px}
  .task{padding:18px 16px}
  .brief .txt{padding:24px}
}
@media (display-mode:standalone){.shell{margin-top:max(14px,env(safe-area-inset-top))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

// ───────────── Mini-Markup: **fett**, *kursiv*, __unterstrichen__, „- “ Liste, Leerzeile = Absatz ─────────────
function md(s){
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  return String(s ?? '').replace(/^(#\s.*)$/gm, '\n$1\n').trim().split(/\n\s*\n/).map(par => {
    const lines = par.split('\n').filter(l => l.trim());
    if(!lines.length) return '';
    if(lines.every(l => /^\s*[-•]\s+/.test(l))) return '<ul>' + lines.map(l => `<li>${inl(l.replace(/^\s*[-•]\s+/, ''))}</li>`).join('') + '</ul>';
    if(/^#\s/.test(par)) return `<h4>${inl(par.replace(/^#\s/, ''))}</h4>`;
    return '<p>' + lines.map(inl).join('<br>') + '</p>';
  }).join('');
}
// Wortspeicher-Wörter in Texten gepunktet unterstreichen (antippen → Wortspeicher)
function gloss(html){
  const W = (APP.wortbank || []).filter(w => w.markieren !== false);
  if(!W.length) return html;
  W.forEach((w, i) => {
    const f = (w.form || w.wort).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp(`(^|[^\\wäöüÄÖÜß>-])(${f})(?![\\wäöüÄÖÜß])(?![^<]*>)`, 'i'), `$1<span class="gl" data-w="${i}">$2</span>`);
  });
  return html;
}

// Lückentext: „Tom [went|walked] home.“  – modus "tippen" (Standard) oder "auswahl" (Wortkasten)
B.luecken = (b, st) => {
  const parts = String(b.text).split(/(\[[^\]]+\])/);
  const gaps = parts.filter(p => /^\[.*\]$/.test(p)).map(p => p.slice(1, -1).split('|'));
  const pick = b.modus === 'auswahl';
  st.v ||= gaps.map(() => '');
  const pool = shuffle([...gaps.map(g => g[0]), ...(b.ablenker || [])], gaps.length * 31 + 3);
  let act = st.v.findIndex(x => !x);
  return {
    auto: true,
    html: () => {
      let g = -1;
      const txt = parts.map(p => /^\[.*\]$/.test(p) ? (g++, pick ? `<button class="gslot" data-g="${g}"></button>`
        : `<input class="gin" data-g="${g}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(70, Math.max(...gaps[g].map(x => x.length)) * 13 + 34)}px">`)
        : esc(p).replace(/\n/g, '<br>')).join('');
      return `<div class="gtext">${txt}</div>` + (pick ? `<div class="bank">${pool.map((w, i) => `<button class="chip" data-p="${i}">${esc(w)}</button>`).join('')}</div>` : '');
    },
    mount(el){
      if(pick){
        $$('.gslot', el).forEach(x => x.onclick = () => { if(st.lock) return; const g = +x.dataset.g; if(st.v[g]){ st.v[g] = ''; } act = g; paint(el); clearMarks(el); });
        $$('.bank .chip', el).forEach(x => x.onclick = () => { if(st.lock) return; let g = act >= 0 && !st.v[act] ? act : st.v.findIndex(v => !v); if(g < 0) return;
          st.v[g] = pool[+x.dataset.p]; act = st.v.findIndex(v => !v); paint(el); clearMarks(el); });
      } else {
        $$('.gin', el).forEach(x => { x.value = st.v[+x.dataset.g] || ''; x.oninput = () => { st.v[+x.dataset.g] = x.value; x.classList.remove('ok', 'bad'); save(); };
          x.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); const n = $(`.gin[data-g="${+x.dataset.g + 1}"]`, el); n ? n.focus() : x.blur(); } }; });
      }
      paint(el);
    },
    filled: () => st.v.every(x => String(x).trim()),
    check(el){ let n = 0; gaps.forEach((g, i) => { const ok = g.some(a => norm(a) === norm(st.v[i])); n += ok;
        const e = $(`[data-g="${i}"]`, el); e.classList.add(ok ? 'ok' : 'bad'); });
      return n === gaps.length ? true : n; },
    reveal(el){ gaps.forEach((g, i) => st.v[i] = g[0]); paint(el); $$('[data-g]', el).forEach(e => { e.classList.remove('bad'); e.classList.add('ok'); if(e.tagName === 'INPUT') e.value = st.v[+e.dataset.g]; }); },
  };
  function paint(el){
    if(!pick) return;
    $$('.gslot', el).forEach(x => { const g = +x.dataset.g; x.textContent = st.v[g] || ''; x.classList.toggle('f', !!st.v[g]); x.classList.toggle('act', g === act && !st.v[g]); });
    const used = st.v.slice(); $$('.bank .chip', el).forEach(x => { const w = pool[+x.dataset.p]; const k = used.indexOf(w); x.classList.toggle('used', k >= 0); if(k >= 0) used[k] = null; });
    save();
  }
};

        if(sel == null){ toast(T.tapPair); return; } st.v[sel] = r; sel = null; paint(el); clearMarks(el); });
      paint(el);

  };
  function paint(el){
    $$('[data-l]', el).forEach(x => { const i = +x.dataset.l, has = st.v[i] != null; const c = has ? COL[i % COL.length] : '';
      x.classList.toggle('on', sel === i); const d = $('i', x); d.style.background = c || '#fff'; d.textContent = has ? i + 1 : ''; });
    $$('[data-r]', el).forEach(x => { const r = +x.dataset.r, owner = Object.keys(st.v).find(k => st.v[k] === r); const d = $('i', x);
      d.style.background = owner != null ? COL[owner % COL.length] : '#fff'; d.textContent = owner != null ? +owner + 1 : ''; });
    save();
  }

// Reihenfolge: elemente in richtiger Reihenfolge; modus "satz" (nebeneinander) oder "liste" (untereinander)

    auto: true,

    mount(el){ paint(el); },
    filled: () => st.v.length === E.length,
    check(el){ const ok = st.v.every((x, i) => E[x] === E[i]); // gleiche Texte gelten als gleich
      $('.order', el).classList.add(ok ? 'ok' : 'bad');
      if(!ok) $$('.order .chip', el).forEach((c, i) => c.classList.add(E[st.v[i]] === E[i] ? 'ok' : 'bad'));
      return ok ? true : st.v.filter((x, i) => E[x] === E[i]).length; },
    reveal(el){ st.v = E.map((_, i) => i); paint(el); $('.order', el).classList.remove('bad'); $('.order', el).classList.add('ok'); },
  };

    $$('[data-o]', o).forEach(x => x.onclick = () => { if(st.lock) return; st.v.splice(+x.dataset.o, 1); o.classList.remove('ok', 'bad'); paint(el); });
    $$('[data-p]', p).forEach(x => x.onclick = () => { if(st.lock) return; st.v.push(+x.dataset.p); o.classList.remove('ok', 'bad'); paint(el); });

};

    mount(el){ $$('.tok', el).forEach(x => x.onclick = () => { if(st.lock) return; const i = +x.dataset.t; st.v = st.v.includes(i) ? st.v.filter(k => k !== i) : [...st.v, i]; clearMarks(el); paint(el); }); paint(el); },
    filled: () => st.v.length > 0,
    check(el){ const tg = toks.map((t, i) => t.t ? i : -1).filter(i => i >= 0); let n = 0, wrong = 0;
      $$('.tok', el).forEach(x => { const i = +x.dataset.t, on = st.v.includes(i); if(on && toks[i].t){ x.classList.add('ok'); n++; } else if(on){ x.classList.add('bad'); wrong++; } });
      return n === tg.length && !wrong ? true : Math.max(0, n - wrong); },
    reveal(el){ st.v = toks.map((t, i) => t.t ? i : -1).filter(i => i >= 0); paint(el); $$('.tok', el).forEach(x => { x.classList.remove('bad'); if(st.v.includes(+x.dataset.t)) x.classList.add('ok'); }); },
  };
  function paint(el){ $$('.tok', el).forEach(x => x.classList.toggle('on', st.v.includes(+x.dataset.t))); save(); }
};

// Schreiben: offen, keine Prüfung; mindestwoerter, satzanfaenge, checkliste

    html: () => (b.satzanfaenge ? `<div class="starters">${b.satzanfaenge.map((s, i) => `<button class="chip" data-s="${i}">${esc(s)}</button>`).join('')}</div>` : '') +

      (b.mindestwoerter ? `<div class="wcount"></div>` : '') +
      (b.checkliste ? `<div class="olabel" style="margin-top:14px">${T.checklist}</div><div class="check">${b.checkliste.map((c, i) => `<button data-c="${i}"><i>${ic('check')}</i><span>${esc(c)}</span></button>`).join('')}</div>` : ''),
    mount(el){ const ta = $('textarea', el); ta.value = st.v;

      $$('[data-c]', el).forEach(x => x.onclick = () => { const i = +x.dataset.c; st.c = st.c.includes(i) ? st.c.filter(k => k !== i) : [...st.c, i]; paint(el); save(); });

    $$('[data-c]', el).forEach(x => x.classList.toggle('on', st.c.includes(+x.dataset.c))); updFoot(); }

// Kurzantwort: ein Eingabefeld, antworten = erlaubte Lösungen
B.kurzantwort = (b, st) => {

// Dialog: rollen {A:{name, bild}, B:{…}}, zeilen [{r:"A", text:"Hello [Tom]!", de:"…"}], modus "schritt" | "luecken" | "deutsch" | "lesen"
B.dialog = (b, st) => {
  const keys = Object.keys(b.rollen), COLS = ['#E5484D', '#1F7A7A', '#2F6FEB', '#8E4EC6'];
  const col = r => b.rollen[r].farbe || COLS[keys.indexOf(r) % COLS.length];
  const stud = r => (S.names || [])[keys.indexOf(r)] || '';
  const av = r => b.rollen[r].bild ? `<img class="av" style="--c:${col(r)}" src="${esc(b.rollen[r].bild)}" alt="">` : `<span class="dot" style="--c:${col(r)}">${esc(b.rollen[r].name[0])}</span>`;
  const plain = t => esc(t).replace(/\[([^\]]+)\]/g, '$1');
  const line = z => b.modus === 'luecken' ? esc(z.text).replace(/\[([^\]]+)\]/g, (m, w) => `<span class="blk" style="--len:${w.length}"></span>`) : b.modus === 'deutsch' ? esc(z.de || '') : gloss(plain(z.text));
  st.i ??= b.modus === 'schritt' ? 0 : -1;
  return {
    html: () => `<div class="dyn"></div>`,
    mount(el){ paint(el); },
    ready: () => b.modus !== 'schritt' || st.i < 0 || st.i >= b.zeilen.length - 1,
  };
  function paint(el){
    const d = $('.dyn', el);

        <div class="tfoot" style="border:0;padding-top:0"><button class="btn light sm" id="dAll">${T.stepAll}</button><span class="sp"></span>
        ${st.i > 0 ? `<button class="btn light sm" id="dPrev">${ic('back')}</button>` : ''}${st.i < b.zeilen.length - 1 ? `<button class="btn dark sm" id="dNext">${T.stepNext} ${ic('arrow')}</button>` : ''}</div>`;
      $('#dNext', d) && ($('#dNext', d).onclick = () => { st.i++; save(); paint(el); updFoot(); });
      $('#dPrev', d) && ($('#dPrev', d).onclick = () => { st.i--; save(); paint(el); });

      $('#dAgain', d) && ($('#dAgain', d).onclick = () => { st.i = 0; save(); paint(el); });

// Timer
function tick(){
  if(!TOTAL() || !S.end || S.screen === 'report') return;
  const left = (S.end - Date.now()) / 1000, el = $('#timer');
  if(el){ $('span', el).textContent = fmt(left); el.classList.toggle('warn', left <= 180 && left > 60); el.classList.toggle('crit', left <= 60); }
  if(S.screen === 'station' && MIN() && S.enter && !S.fit[S.st] && S.st < ST().length - 1 && Date.now() - S.enter.t > MIN() * 1000){
    S.fit[S.st] = 1; save();
    sheet(`<div class="badge-ic">${ic('star')}</div><h2>${T.fit}</h2><p>${T.fitTxt(S.st + 2)}</p><div class="sh-btns"><button class="btn light" data-a="close">${T.fitStay}</button><button class="btn dark" data-a="fitgo">${T.fitGo(S.st + 2)} ${ic('arrow')}</button></div>`);
  }
  if(left <= 0) timeUp();
}
function timeUp(){
  if($('#ovl').classList.contains('open') && $('#sheet').dataset.k === 'tu') return;
  if(EXTRA() && !S.extra){ sheet(`<div class="badge-ic">${ic('clock')}</div><h2>${T.timeup}</h2><p>${T.more(Math.round(EXTRA() / 60))}</p><div class="sh-btns"><button class="btn light" data-a="end">${T.no}</button><button class="btn dark" data-a="extra">${T.yes(Math.round(EXTRA() / 60))}</button></div>`); $('#sheet').dataset.k = 'tu'; }

}

}
function nextTask(){
  const n = S.st, t = S.tk, s = ST()[n], st = R(n, t);
  if(!CUR.auto){ st.done = true; st.how = 'open'; if(CUR.text) st.text = CUR.text(); }
  save();
  if(t < s.bausteine.length - 1){ S.tk = t + 1; save(); reset(); render(); return; }
  if(n < ST().length - 1){ toast(T.levelDone(n + 1)); confetti(1.2); enterStation(n + 1); return; }
  sheet(`<div class="badge-ic">${ic('trophy')}</div><h2>${T.ready}</h2><div class="sh-btns"><button class="btn light" data-a="close">${T.back}</button><button class="btn dark" data-a="report">${T.readyBtn} ${ic('arrow')}</button></div>`);
}

// Bericht
function rReport(){
  let all = 0, ok = 0;
  const cards = ST().map((s, n) => {
    const rows = s.bausteine.map((b, t) => {
      if(['info', 'lesetext', 'audio'].includes(b.typ)) return '';
      const r = R(n, t), auto = !!B[b.typ](b, JSON.parse(JSON.stringify(r))).auto;
      let m = 'd', lab = T.open2, icn = 'x';
      if(r.done){ if(!auto){ m = 'a'; lab = T.done; icn = 'check'; } else if(r.how === 'first'){ m = 'a'; lab = T.firstTry; icn = 'check'; } else if(r.how === 'tries'){ m = 'b'; lab = T.afterTries; icn = 'check'; } else { m = 'c'; lab = T.withHelp; icn = 'bulb'; } }
      if(auto){ all++; if(r.done && r.how !== 'help') ok++; }
      const txt = r.text || (b.typ === 'schreiben' || b.typ === 'kurzantwort' ? r.v : '');
      return `<div class="rrow"><span class="m ${m}">${ic(icn)}</span><div><b>${esc(b.titel || '')}</b> <span style="color:var(--muted)">· ${lab}</span>${txt ? `<blockquote>${esc(txt)}</blockquote>` : ''}</div></div>`;
    }).join('');
    return rows ? `<div class="rcard"><h4>${stars(s.sterne || n + 1)} ${T.level} ${n + 1} · ${esc(s.titel)}</h4>${rows}</div>` : '';
  }).join('');
  const A = APP.abschluss || {};
  $('#view').innerHTML = `<div class="ask"><div class="badge-ic">${ic('trophy')}</div><h2>${esc(A.titel || (EN ? 'Well done' : 'Geschafft') + ((S.names || []).filter(Boolean).length ? ', ' + S.names.filter(Boolean).join(' & ') : '') + '!')}</h2>
    ${all ? `<div class="score">${ic('check')} ${T.resultsOf(ok, all)}</div>` : ''}<p style="margin-top:14px">${esc(A.text || T.show)}</p></div>
    <div class="rep">${cards}</div><div style="text-align:center;margin-top:18px"><button class="linkbtn" data-a="restart">${T.again}</button></div>`;
  if(!S.party){ S.party = 1; save(); confetti(2); }
}

// Wortspeicher
function bindGloss(root){ $$('.gl', root).forEach(g => g.onclick = e => { e.stopPropagation(); showBank(+g.dataset.w); }); }
function showBank(sel){
  const W = APP.wortbank || [];
  sheet(`<div class="shead"><h2>${T.bank}</h2><button class="ib" data-a="close">${ic('x')}</button></div><div class="wgrid">${W.length ? W.map((w, i) =>
    `<div class="wcard ${i === sel ? 'sel' : ''}" id="w${i}"><div class="w-en">${esc(w.wort)}</div><div class="w-de">${esc(w.bedeutung || '')}</div>${w.beispiel ? `<div class="w-ex">${esc(w.beispiel)}</div>` : ''}</div>`).join('') : T.bankEmpty}</div>`, 'bankw');
  if(sel != null) setTimeout(() => $('#w' + sel)?.scrollIntoView({block:'center', behavior:'smooth'}), 120);
}

// Overlay, Toast, Konfetti
function sheet(html, cls){ const sh = $('#sheet'); sh.className = 'sheet' + (cls ? ' ' + cls : ''); sh.dataset.k = ''; sh.innerHTML = html; sh.scrollTop = 0; $('#ovl').classList.add('open'); }
function closeSheet(){ $('#ovl').classList.remove('open'); }
function toast(t, ms=2600){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('show'), ms); }
function confetti(amount=1){
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
  const cols = ['#FFC93C', '#E5484D', '#22B26B', '#2F6FEB', '#8E4EC6', getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#fff'];
  const ps = Array.from({length:Math.round(90 * amount)}, () => ({x:innerWidth / 2 + (Math.random() - .5) * 200, y:innerHeight * .55, vx:(Math.random() - .5) * 16, vy:-Math.random() * 16 - 6, r:Math.random() * 6 + 4, c:cols[Math.floor(Math.random() * cols.length)], a:Math.random() * 6, s:(Math.random() - .5) * .3}));
  const t0 = performance.now();
  (function f(t){ x.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.vx *= .99; p.a += p.s; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); x.restore(); });
    if(t - t0 < 2200) requestAnimationFrame(f); else { x.clearRect(0, 0, c.width, c.height); c.style.display = 'none'; } })(t0);
}

// Klicks (data-a)
function act(a){
  const n = S.st;
  switch(a){
    case 'close': closeSheet(); break;
    case 'startst': S.seen[n] = 1; goStation(n, firstOpen(n)); break;
    case 'prevst': goStation(n - 1, 0); break;
    case 'prevt': S.tk--; save(); reset(); render(); break;
    case 'nextt': nextTask(); break;
    case 'check': doCheck(); break;
    case 'tip': { const b = task(n, S.tk); feedback('tipbox', `${ic('bulb')} <span>${esc(b.tipp)}</span>`); break; }
    case 'reveal': { const st = R(n, S.tk); CUR.reveal($('#tb')); st.done = true; st.lock = true; st.how = 'help'; save(); const b = task(n, S.tk);
      feedback('tipbox', `${ic('bulb')} <span>${esc(b.erklaerung || T.solved)}</span>`); updFoot(); break; }
    case 'fitgo': closeSheet(); enterStation(n + 1); break;
    case 'extra': S.extra = true; S.end = Date.now() + EXTRA() * 1000; save(); closeSheet(); break;
    case 'end': case 'report': S.screen = 'report'; save(); reset(); render(); break;
    case 'resume': S.screen = S.prev || 'station'; save(); render(); break;
    case 'restart': sheet(`<div class="badge-ic">${ic('refresh')}</div><h2>${T.sure}</h2><p>${T.sureTxt}</p><div class="sh-btns"><button class="btn light" data-a="close">${T.cancel}</button><button class="btn dark" data-a="wipe">${T.yesDel}</button></div>`); break;
    case 'wipe': S = fresh(); save(); reset(); render(); break;
  }
}
document.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if(t){ e.preventDefault(); act(t.dataset.a); } });
$('#ovl').addEventListener('click', e => { if(e.target.id === 'ovl' && $('#sheet').dataset.k !== 'tu') closeSheet(); });

// Testmodus
function devMenu(){
  if(!DEV) return; let d = $('.dev'); if(!d){ d = document.createElement('div'); d.className = 'dev'; document.body.appendChild(d); }
  const o = ['<option value="">DEV – springen …</option>', '<option value="intro">Start</option>'];
  ST().forEach((s, n) => { o.push(`<option value="b${n}">L${n + 1} Erklärung</option>`); s.bausteine.forEach((b, t) => o.push(`<option value="s${n}.${t}">L${n + 1}.${t + 1} ${esc(b.typ)} – ${esc(b.titel || '')}</option>`)); });
  o.push('<option value="report">Ergebnis</option>');
  d.innerHTML = `DEV <select>${o.join('')}</select>`;
  $('select', d).onchange = e => { const v = e.target.value; if(!v) return; if(!S.end && TOTAL()) S.end = Date.now() + TOTAL() * 1000;
    if(v === 'intro' || v === 'report'){ S.screen = v; save(); reset(); render(); } else if(v[0] === 'b') goBrief(+v.slice(1)); else { const [a, b] = v.slice(1).split('.').map(Number); goStation(a, b); } };
}

// Passwort (nur bei urheberrechtlich geschützten Texten)
async function unlock(pw){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(ENC.s), iterations:ENC.n, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(ENC.i)}, key, b(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(){
  $('#view').innerHTML = `<div class="lock"><div class="badge-ic">${ic('lock')}</div><h2>${esc(META.frage)}</h2><p>${T.pwTxt}</p><input class="tin" id="pw" type="password" placeholder="${T.pw}" autocomplete="off"><small id="pm"></small><button class="btn dark big" id="pgo">${T.open} ${ic('arrow')}</button></div>`;
  const go = async () => { $('#pgo').disabled = true; try{ APP = await unlock($('#pw').value.trim()); try{ sessionStorage.setItem(KEY + '-k', $('#pw').value.trim()); }catch(e){} boot(); }
    catch(e){ $('#pgo').disabled = false; $('#pm').textContent = T.pwBad; } };
  $('#pgo').onclick = go; $('#pw').onkeydown = e => { if(e.key === 'Enter') go(); };
}
function duForm(){
  if(EN || (APP.namen ?? 2) !== 1) return;
  Object.assign(T, {goal:'Dein Ziel:', minutes:m => `Du hast ${m} Minuten Zeit.`, wrong:'Noch nicht ganz. Versuch es noch einmal.', wrong2:'Noch nicht ganz. Schau dir den Tipp an.',
    partly:n => `${n} richtig. Schau dir die roten noch einmal an.`, solved:'Hier ist die Lösung. Lies sie genau.', complete:'Bearbeite zuerst alles.',
    more:m => `Brauchst du noch ${m} Minuten?`, no:'Nein, ich bin fertig', timeup2:'Die Zeit ist um! Jetzt siehst du dein Ergebnis.', results:'Dein Ergebnis',
    show:'Zeig diese Seite deiner Lehrkraft.', sure:'Bist du sicher?', fit:'Super, du bist fit!', fitTxt:n => `Du kannst jetzt zu Level ${n} weitergehen.`,
    write:'Schreib hier …', checklist:'Prüfe deinen Text:', answer:'Deine Antwort …', tapGap:'Tippe auf eine Lücke und dann auf ein Wort.',
    tapPair:'Tippe links auf einen Begriff und dann rechts auf das Passende.', tapCat:'Tippe auf eine Karte und dann auf die passende Gruppe.',
    tapOrder:'Tippe die Teile in der richtigen Reihenfolge an.', tapMark:'Tippe die Wörter an.', tapFlip:'Tippe die Karten an, um sie umzudrehen.',
    pwTxt:'Gib das Klassenpasswort ein.', pwBad:'Das Passwort stimmt nicht. Versuch es noch einmal.', ready:'Fertig? Danach kannst du nicht mehr zurück.'});
}
function boot(){
  duForm();
  S = load() || fresh();
  if(S.screen !== 'intro' && S.screen !== 'report' && S.screen !== 'resume'){ S.prev = S.screen; S.screen = 'resume'; }
  if(S.screen === 'resume' && !S.prev) S.prev = 'station';
  render(); setInterval(tick, 1000);
}
(async function init(){
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if(!APP && ENC){
    const k = (location.hash.match(/k=([^&]+)/) || [])[1] || (() => { try{ return sessionStorage.getItem(KEY + '-k'); }catch(e){ return null; } })();
    if(k){ try{ APP = await unlock(decodeURIComponent(k)); }catch(e){} }
    if(!APP){ lockScreen(); return; }
  }
  boot();
})();
</script>
